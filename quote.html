<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeep® | 견적서</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Regular.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Medium.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-SemiBold.woff2" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2/Pretendard-Bold.woff2" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
  <link rel="stylesheet" href="design-system/tokens.css" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --black: var(--color-secondary, #000000);
      --near-black: var(--color-gray-900, #0f0f0f);
      --gray-light: var(--color-gray-100, #dbdbdb);
      --gray-line: var(--color-gray-200, #c1c1c1);
      --gray-bg: var(--color-gray-50, #f4f4f4);
      --white: var(--color-white, #ffffff);
      --text-gray: #d7d7d7; /* 디자인시스템에 매칭되는 토큰 없음 */
      --gray-mid: var(--color-gray-600, #757575);
      --gray-desc: #424242; /* 디자인시스템에 매칭되는 토큰 없음 */
    }

    html { scroll-behavior: smooth; }

    :root { --page-scale: 1; }

    html, body { overflow-x: hidden; }
    body {
      font-family: 'Pretendard', sans-serif;
      background: var(--white);
      color: var(--black);
      overflow: hidden;
      word-break: keep-all;
    }

    /* 1920 기준 데스크톱 레이아웃을 1024px까지는 그대로 비율 축소 */
    .scale-outer {
      position: relative;
      width: 100%;
      overflow: hidden;
      background: var(--white);
    }
    .page {
      position: absolute;
      top: 0; left: 50%;
      width: 1920px;
      transform: translateX(-50%) scale(var(--page-scale));
      transform-origin: top center;
      background: var(--white);
    }

    /* ─── PAGE LAYOUT ───
       왼쪽 미리보기는 완전히 고정, 오른쪽 옵션 패널만 독립적으로 스크롤되도록
       뷰포트 높이에 맞춘 2단 구성. (기존엔 페이지 전체가 스크롤되고 왼쪽이
       position:sticky로 따라오는 구조라, 스크롤 시작 시 왼쪽도 잠깐 같이 움직였음) */
    .quote-page {
      margin-top: 80px;
      height: calc(100vh - 80px);
      padding: 0 30px;
      display: grid;
      grid-template-columns: 1120px 620px;
      justify-content: space-between;
      overflow: hidden;
    }

    /* ─── 좌측: 갤러리 (고정, 스크롤 없음, 상단 정렬) ─── */
    .quote-gallery { align-self: start; padding: 60px 0; }
    .quote-gallery-main {
      width: 100%;
      display: flex; align-items: flex-start; justify-content: center;
    }
    .quote-gallery-main img { width: 100%; height: auto; }
    .quote-gallery-tabs {
      display: flex; margin-top: 40px;
    }
    .quote-tab {
      flex: 1;
      height: 40px;
      display: flex; align-items: center; justify-content: center;
      background: var(--white);
      border: 1px solid var(--black);
      border-left: none;
      font-family: 'Pretendard', sans-serif;
      font-size: 14px; font-weight: 400; color: var(--black);
      cursor: pointer;
      text-transform: uppercase;
    }
    .quote-tab:first-child { border-left: 1px solid var(--black); }
    .quote-tab.active { background: var(--black); color: var(--white); font-weight: 700; }

    /* ─── 우측: 옵션 패널 ─── */
    /* ─── 우측: 옵션 패널 (독립 스크롤) ─── */
    .quote-panel {
      height: 100%;
      overflow-y: auto;
      padding: 60px 0 140px;
      scrollbar-width: none; -ms-overflow-style: none;
    }
    .quote-panel::-webkit-scrollbar { display: none; }

    .quote-model-name {
      font-family: 'Oswald', sans-serif;
      font-size: 40px; font-weight: 700; color: var(--black);
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .quote-section { margin-bottom: 34px; }
    .quote-section-title {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 12px; margin-bottom: 20px;
      border-top: 2px solid var(--gray-desc);
      padding-top: 12px;
    }
    .quote-section-title-left { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
    .quote-section-title-left .label { font-size: 20px; font-weight: 700; color: var(--black); }
    .quote-section-title-left .value { font-size: 16px; font-weight: 400; color: var(--black); }
    /* 색상/휠 헤더의 화살표 아이콘: 피그마 모바일뷰(node 4073:53573)에만 있어서 모바일 전용으로 노출 */
    .quote-section-title > .material-symbols-outlined { display: none; }

    .quote-swatch-row { display: flex; gap: 12px; align-items: center; }
    .quote-swatch-wrap { position: relative; width: 60px; height: 60px; cursor: pointer; }
    .quote-swatch-radio { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
    .quote-swatch {
      display: block; width: 60px; height: 60px;
      pointer-events: none;
    }
    .quote-swatch.is-img { border-radius: 50%; object-fit: cover; }
    .quote-swatch-check {
      position: absolute; right: -6px; bottom: -6px;
      width: 24px; height: 24px; border-radius: 50%;
      background: var(--black);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.45s;
    }
    .quote-swatch-check::after {
      content: ''; width: 18px; height: 18px;
      background: url('images/quote-img/icon-check.svg') center / contain no-repeat;
    }
    .quote-swatch-radio:checked ~ .quote-swatch-check { opacity: 1; }

    /* ─── 아코디언 ─── */
    .quote-accordion { border-top: 2px solid var(--gray-desc); margin-bottom: 12px; }
    .quote-accordion-title {
      width: 100%;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0;
      background: none; border: none; cursor: pointer;
      font-family: 'Pretendard', sans-serif;
      font-size: 20px; font-weight: 700; color: var(--black);
    }
    .quote-accordion-title .material-symbols-outlined { transition: transform 0.6s ease; }
    .quote-accordion.collapsed .quote-accordion-title .material-symbols-outlined { transform: rotate(180deg); }
    .quote-accordion-body {
      overflow: hidden;
      max-height: 3000px;
      transition: max-height 0.6s ease;
    }
    .quote-accordion.collapsed .quote-accordion-body { max-height: 0; }

    .quote-subgroup { margin-bottom: 12px; }
    .quote-subgroup-title { font-size: 16px; font-weight: 700; color: var(--black); margin-bottom: 12px; }
    .quote-item-list { display: flex; flex-direction: column; gap: 12px; }

    .quote-item {
      position: relative;
      display: flex; align-items: center; justify-content: space-between;
      height: 90px;
      border: 1px solid var(--gray-line);
      padding-right: 20px;
      cursor: pointer;
    }
    .quote-item-radio { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .quote-item-left { display: flex; align-items: center; gap: 20px; height: 100%; }
    .quote-item-thumb { width: 110px; height: 88px; object-fit: cover; flex-shrink: 0; }
    /* 피그마에서 흰 배경 위에 이미지 전체를 보여주도록 수정된 아이템(스페어타이어커버 등)용 */
    .quote-item-thumb.is-contain { object-fit: contain; background: var(--white); }
    .quote-item-info { display: flex; flex-direction: column; gap: 2px; }
    .quote-item-name { font-size: 16px; font-weight: 600; color: var(--black); }
    .quote-item-price { font-size: 14px; font-weight: 500; color: var(--black); }
    /* 이름이 2줄로 넘어가는 아이템(피그마 모바일뷰 기준 줄바꿈 지점 고정) */
    .mobile-break { display: none; }
    .quote-radio-dot {
      width: 24px; height: 24px; border-radius: 50%;
      border: 1px solid var(--gray-mid);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.45s, border-color 0.45s;
    }
    .quote-radio-dot::after {
      content: ''; width: 18px; height: 18px;
      background: url('images/quote-img/icon-check.svg') center / contain no-repeat;
      opacity: 0;
    }
    .quote-item-radio:checked ~ .quote-radio-dot { background: var(--black); border-color: var(--black); }
    .quote-item-radio:checked ~ .quote-radio-dot::after { opacity: 1; }

    /* ─── 하단 고정 바 ─── */
    .quote-sticky-bar {
      position: fixed; left: 50%; bottom: 0;
      width: 1920px;
      transform: translateX(-50%);
      transform-origin: bottom center;
      display: flex; align-items: stretch;
      border-top: 1px solid var(--color-gray-500, #8e8e8e);
      z-index: 500;
    }
    .quote-sticky-info {
      flex: 1;
      background: var(--white);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 5%;
      height: 83px;
    }
    .quote-sticky-name {
      font-family: 'Oswald', sans-serif;
      font-size: 30px; font-weight: 700; color: var(--black); text-transform: uppercase;
    }
    .quote-sticky-price { font-size: 30px; font-weight: 700; color: var(--black); }
    .quote-sticky-btn {
      flex-shrink: 0; width: 320px;
      background: var(--black); color: var(--white);
      border: none; cursor: pointer;
      font-family: 'Pretendard', sans-serif;
      font-size: 20px; font-weight: 700;
      transition: background 0.45s;
    }
    .quote-sticky-btn:hover { background: var(--color-primary, #487f70); }

    /* ─── 준비중 팝업(공용 컴포넌트가 주입) ─── */

    /* ══════════════════════ NAV + 하단 고정바: 1024px 이상에서는 페이지와 같은 비율로 축소 동기화 ══════════════════════ */
    @media (min-width: 1024px) {
      body nav.__jeep-nav {
        left: 50% !important;
        transform: translateX(-50%) scale(var(--page-scale, 1)) !important;
        transform-origin: top center !important;
      }
      .quote-sticky-bar {
        transform: translateX(-50%) scale(var(--page-scale, 1));
      }
    }

    /* ══════════════════════ TABLET + MOBILE (1024px 미만): 비율 축소 대신 일반 흐름 레이아웃 ══════════════════════ */
    @media (max-width: 1023.98px) {
      html, body { min-width: 0; }
      .scale-outer { width: 100%; height: auto !important; overflow: visible; }
      .page { position: static; width: 100%; height: auto; overflow: visible; transform: none !important; }
      .quote-sticky-bar { left: 0; width: 100%; transform: none; }

      /* nav: 모바일+태블릿 nav 스타일은 components/header.js 컴포넌트 안으로 합쳐짐 */
    }

    /* ══════════════════════ MOBILE (768px 이하) — 피그마 모바일뷰(node 4073:53573) 기준 ══════════════════════ */
    @media (max-width: 1023.98px) {
      html, body { min-width: 0; overflow: visible; overflow-x: hidden; }

      /* 데스크톱은 좌측 고정 + 우측 독립 스크롤 2단 구성이지만,
         모바일은 이미지 → 탭 → 옵션이 한 줄로 이어지는 일반 스크롤 페이지 */
      .quote-page {
        margin-top: 56px; height: auto; padding: 0;
        display: block; overflow: visible;
      }
      .quote-gallery { height: 280px; padding: 20px 16px 0; }
      /* 차량 이미지는 피그마처럼 좌우 패딩 없이 뷰포트 폭 꽉 채움(가로 여백만 상쇄) */
      .quote-gallery-main { margin: 0 -16px; }
      .quote-gallery-main img { width: 100%; max-width: none; height: auto; }
      .quote-gallery-tabs { margin-top: 20px; }
      .quote-tab { height: 40px; font-size: 13px; }

      .quote-panel {
        height: auto; overflow: visible; padding: 20px 16px 110px;
      }
      /* 피그마 모바일뷰(4073:53573) 실측 결과 모델명/스와치/아코디언·서브그룹 타이틀/
         아이템 썸네일은 데스크톱과 동일 크기라, 아래는 데스크톱 값을 그대로 상속하고
         실제로 다른 값(패딩·간격·하단바 높이 등)만 오버라이드한다. */
      .quote-model-name { font-size: 40px; margin-bottom: 24px; }
      .quote-section { margin-bottom: 40px; }
      .quote-section-title-left .label { font-size: 20px; }
      .quote-section-title > .material-symbols-outlined { display: block; }

      .quote-item { padding-right: 12px; }
      .quote-item-left { gap: 10px; }
      .quote-item-name, .quote-item-price { font-size: 14px; }
      .mobile-break { display: inline; }
      .quote-item-name.is-2line { line-height: 1.6; }

      /* 하단 고정 바: 모델명 없이 가격 + 구매신청만, 높이 60px (피그마 모바일뷰 4073:53573 실측) */
      .quote-sticky-info { padding: 0 20px; height: 60px; justify-content: flex-end; }
      .quote-sticky-name { display: none; }
      .quote-sticky-price { font-size: 20px; }
      .quote-sticky-btn { width: auto; height: 60px; padding: 10px 59px; font-size: 14px; }
    }
  </style>
</head>
<body>

<script src="components/header.js"></script>
<script src="components/modal.js"></script>

<div class="scale-outer">
<div class="page">

<div class="quote-page">

  <!-- ═══ 좌측 갤러리 ═══ -->
  <div class="quote-gallery">
    <div class="quote-gallery-main">
      <img src="images/quote-img/car-main.png" alt="Jeep Wrangler" />
    </div>
    <div class="quote-gallery-tabs">
      <button type="button" class="quote-tab active">EXTERIOR</button>
      <button type="button" class="quote-tab">INTERIOR</button>
      <button type="button" class="quote-tab">HIGHLIGHT</button>
    </div>
  </div>

  <!-- ═══ 우측 옵션 패널 ═══ -->
  <div class="quote-panel">
    <h1 class="quote-model-name">Wrangler</h1>

    <!-- 색상 -->
    <div class="quote-section">
      <div class="quote-section-title">
        <div class="quote-section-title-left">
          <span class="label">색상</span>
          <span class="value">블랙</span>
        </div>
        <span class="material-symbols-outlined">keyboard_arrow_down</span>
      </div>
      <div class="quote-swatch-row">
        <label class="quote-swatch-wrap">
          <input type="radio" name="color" class="quote-swatch-radio" data-name="화이트" />
          <span class="quote-swatch" style="background:#fbfbfb; border:1px solid var(--gray-light);"></span>
          <span class="quote-swatch-check"></span>
        </label>
        <label class="quote-swatch-wrap">
          <input type="radio" name="color" class="quote-swatch-radio" data-name="블랙" checked />
          <span class="quote-swatch" style="background:#282828;"></span>
          <span class="quote-swatch-check"></span>
        </label>
        <label class="quote-swatch-wrap">
          <input type="radio" name="color" class="quote-swatch-radio" data-name="레드" />
          <span class="quote-swatch" style="background:red;"></span>
          <span class="quote-swatch-check"></span>
        </label>
        <label class="quote-swatch-wrap">
          <input type="radio" name="color" class="quote-swatch-radio" data-name="옐로우" />
          <span class="quote-swatch" style="background:#fc0;"></span>
          <span class="quote-swatch-check"></span>
        </label>
      </div>
    </div>

    <!-- 휠 -->
    <div class="quote-section">
      <div class="quote-section-title">
        <div class="quote-section-title-left">
          <span class="label">휠</span>
          <span class="value">18인치 머신드 페인티드 발틱 그레이 휠</span>
        </div>
        <span class="material-symbols-outlined">keyboard_arrow_down</span>
      </div>
      <div class="quote-swatch-row">
        <label class="quote-swatch-wrap">
          <input type="radio" name="wheel" class="quote-swatch-radio" data-name="17인치 머신드 페인티드 블랙 휠" />
          <img class="quote-swatch is-img" src="images/quote-img/wheel-1.png" alt="17인치 머신드 페인티드 블랙 휠" />
          <span class="quote-swatch-check"></span>
        </label>
        <label class="quote-swatch-wrap">
          <input type="radio" name="wheel" class="quote-swatch-radio" data-name="18인치 알루미늄 휠" />
          <img class="quote-swatch is-img" src="images/quote-img/wheel-2.png" alt="18인치 알루미늄 휠" />
          <span class="quote-swatch-check"></span>
        </label>
        <label class="quote-swatch-wrap">
          <input type="radio" name="wheel" class="quote-swatch-radio" data-name="17인치 알루미늄 휠" />
          <img class="quote-swatch is-img" src="images/quote-img/wheel-3.png" alt="17인치 알루미늄 휠" />
          <span class="quote-swatch-check"></span>
        </label>
        <label class="quote-swatch-wrap">
          <input type="radio" name="wheel" class="quote-swatch-radio" data-name="18인치 머신드 페인티드 발틱 그레이 휠" checked />
          <img class="quote-swatch is-img" src="images/quote-img/wheel-4.png" alt="18인치 머신드 페인티드 발틱 그레이 휠" />
          <span class="quote-swatch-check"></span>
        </label>
      </div>
    </div>

    <!-- 액세서리 - 내부 -->
    <div class="quote-accordion">
      <button type="button" class="quote-accordion-title" onclick="toggleCollapsed(this)">
        액세서리 - 내부
        <span class="material-symbols-outlined">keyboard_arrow_down</span>
      </button>
      <div class="quote-accordion-body">

        <div class="quote-subgroup">
          <p class="quote-subgroup-title">카펫 바닥 매트</p>
          <div class="quote-item-list">
            <label class="quote-item">
              <input type="radio" name="carpet-mat" class="quote-item-radio" data-price="94900" checked />
              <div class="quote-item-left">
                <img class="quote-item-thumb is-contain" src="images/quote-img/프리미엄 소프트탑 검정 (JK전용).jpg" alt="" />
                <div class="quote-item-info">
                  <p class="quote-item-name">프리미엄 소프트탑 검정 (JK전용)</p>
                  <p class="quote-item-price">94,900원</p>
                </div>
              </div>
              <span class="quote-radio-dot"></span>
            </label>
            <label class="quote-item">
              <input type="radio" name="carpet-mat" class="quote-item-radio" data-price="157600" />
              <div class="quote-item-left">
                <img class="quote-item-thumb is-contain" src="images/quote-img/슬러쉬 매트.jpg" alt="" />
                <div class="quote-item-info">
                  <p class="quote-item-name">슬러쉬 매트</p>
                  <p class="quote-item-price">157,600원</p>
                </div>
              </div>
              <span class="quote-radio-dot"></span>
            </label>
          </div>
        </div>

        <div class="quote-subgroup">
          <p class="quote-subgroup-title">올웨더 바닥 매트</p>
          <div class="quote-item-list">
            <label class="quote-item">

<script>
  var QUOTE_BASE_PRICE = 81699300;

  function updateQuotePrice() {
    var total = QUOTE_BASE_PRICE;
    document.querySelectorAll('.quote-item-radio[data-price]:checked').forEach(function (input) {
      total += Number(input.dataset.price);
    });
    document.getElementById('quoteStickyPrice').textContent = total.toLocaleString('ko-KR') + '원';
  }

  document.querySelectorAll('.quote-item-radio[data-price]').forEach(function (input) {
    input.addEventListener('change', updateQuotePrice);
  });
  updateQuotePrice();

  /* 색상/휠 스와치 선택 시, 섹션 타이틀 옆 값 텍스트를 선택한 옵션 이름으로 갱신 */
  ['color', 'wheel'].forEach(function (radioName) {
    document.querySelectorAll('input[name="' + radioName + '"]').forEach(function (input) {
      input.addEventListener('change', function () {
        var section = input.closest('.quote-section');
        var valueEl = section && section.querySelector('.quote-section-title-left .value');
        if (valueEl) valueEl.textContent = input.dataset.name;
      });
    });
  });
</script>

<script>
  (function () {
    var DESIGN_WIDTH = 1920;
    var TABLET_BREAKPOINT = 1024;
    var page = document.querySelector('.page');
    var outer = document.querySelector('.scale-outer');
    function update() {
      if (window.innerWidth < TABLET_BREAKPOINT) {
        document.documentElement.style.setProperty('--page-scale', 1);
        page.style.transform = '';
        outer.style.height = '';
        return;
      }
      var scale = Math.min(1, window.innerWidth / DESIGN_WIDTH);
      document.documentElement.style.setProperty('--page-scale', scale);
      page.style.transform = 'translateX(-50%) scale(' + scale + ')';
      outer.style.height = (page.offsetHeight * scale) + 'px';
    }
    window.addEventListener('resize', update);
    window.addEventListener('load', update);
    update();
  })();
</script>
